name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx astro check

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Firefox for Playwright
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install Playwright dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Build
        run: npm run build

      - name: Verify build output
        run: |
          if [ ! -d dist ] || [ -z "$(ls -A dist)" ]; then
            echo "Build output directory is empty or missing"
            exit 1
          fi

      - name: Start preview server
        run: |
          nohup npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &
          echo $! > preview.pid

      - name: Wait for preview
        run: |
          timeout 30 bash -c 'until curl -fsS http://127.0.0.1:4173/ > /dev/null 2>&1; do sleep 1; done' || {
            echo "Preview server did not start within 30 seconds"
            cat preview.log || true
            exit 1
          }

      - name: Firefox regression QA
        run: npm run qa:firefox:artifacts

      - name: Upload Firefox QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-qa-${{ github.job }}-${{ github.run_id }}
          path: |
            artifacts/firefox-qa
            preview.log
          if-no-files-found: warn
          retention-days: 7
