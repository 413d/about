name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: package.json
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Firefox for Playwright
        run: npx playwright install --with-deps firefox

      - name: Build
        run: npm run build

      - name: Start preview server
        run: nohup npm run preview -- --host 127.0.0.1 --port 4173 > preview.log 2>&1 &

      - name: Wait for preview
        run: |
          timeout 30 bash -c 'until curl -s http://127.0.0.1:4173/ > /dev/null 2>&1; do sleep 1; done' || {
            echo "Preview server did not start"
            cat preview.log || true
            exit 1
          }

      - name: Firefox regression QA
        run: npm run qa:firefox:artifacts

      - name: Upload QA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: firefox-qa-${{ github.run_id }}
          path: artifacts/firefox-qa
          if-no-files-found: warn
          retention-days: 7
